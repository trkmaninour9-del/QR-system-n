<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاستعلام والنداء الآلي</title>
    <!-- استدعاء التصميم فقط في الرأس لضمان شكل الموقع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- شاشة البداية -->
    <div id="start-screen" class="w-full max-w-md mt-10 text-center block">
        <h1 class="text-3xl font-bold text-orange-500 mb-8">نظام النداء الآلي</h1>
        <div class="space-y-4">
            <button onclick="showUserLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-lg">دخول المشتركين</button>
            <button onclick="showAdminLogin()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-lg transition border border-slate-600 shadow-lg">دخول الإدارة</button>
        </div>
    </div>

    <!-- شاشة دخول المشترك -->
    <div id="user-login-screen" class="w-full max-w-md mt-10 hidden">
        <h2 class="text-2xl font-bold text-center mb-6">تسجيل دخول المشترك</h2>
        <input type="text" id="userNameInput" placeholder="أدخل اسمك الكريم هنا..." class="w-full p-3 rounded-lg bg-slate-800 text-white border border-slate-600 mb-4 focus:border-blue-500 focus:outline-none">
        <button onclick="loginUser()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition mb-2 shadow-lg">متابعة</button>
        <button onclick="goBack()" class="w-full text-slate-400 py-2">رجوع</button>
    </div>

    <!-- لوحة المشترك (الكاميرا + الاستديو + الرسائل) -->
    <div id="user-dashboard" class="w-full max-w-md hidden">
        <div class="flex justify-between items-center mb-6 bg-slate-900 p-4 rounded-lg border border-slate-700 shadow-lg">
            <h2 id="welcome-message" class="text-lg font-bold text-blue-400">أهلاً بك</h2>
            <button onclick="logout()" class="text-red-400 text-sm hover:text-red-300">تسجيل خروج</button>
        </div>
        
        <div id="reader" class="w-full bg-black rounded-lg overflow-hidden border-2 border-slate-700 mb-3 min-h-[250px] flex items-center justify-center text-slate-500 text-sm">جاري تهيئة الكاميرا...</div>
        
        <div class="mb-6 text-center">
            <input type="file" id="qr-input-file" accept="image/*" class="hidden" onchange="scanFileFromGallery(event)">
            <button onclick="document.getElementById('qr-input-file').click()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2.5 px-4 rounded-lg border border-slate-600 transition flex items-center justify-center gap-2 shadow">
                <span>🖼️ مسح رمز QR من الاستديو</span>
            </button>
        </div>

        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 shadow-lg">
            <h3 class="font-bold mb-3 text-orange-400 border-b border-slate-700 pb-2">صندوق الرسائل:</h3>
            <div id="user-messages" class="space-y-2 max-h-48 overflow-y-auto"></div>
        </div>
    </div>

    <!-- شاشة دخول الإدارة -->
    <div id="admin-login-screen" class="w-full max-w-md mt-10 hidden">
        <h2 class="text-2xl font-bold text-center mb-6">تسجيل دخول الإدارة</h2>
        <input type="password" id="adminPassword" placeholder="كلمة المرور..." class="w-full p-3 rounded-lg bg-slate-800 text-white border border-slate-600 mb-4 text-center">
        <button onclick="loginAdmin()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-lg transition mb-2 shadow-lg">دخول</button>
        <button onclick="goBack()" class="w-full text-slate-400 py-2">رجوع</button>
    </div>

    <!-- لوحة الإدارة -->
    <div id="admin-dashboard" class="w-full max-w-md hidden space-y-6 pb-10">
        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-lg border border-slate-700 mt-4 shadow-lg">
            <h2 class="text-xl font-bold text-orange-500">لوحة التحكم</h2>
            <button onclick="logout()" class="text-red-400 text-sm hover:text-red-300">تسجيل خروج</button>
        </div>

        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 shadow-lg">
            <h3 class="font-bold mb-3">إرسال رسالة:</h3>
            <input type="text" id="targetUserInput" placeholder="اسم المشترك (فارغ = للجميع)" class="w-full p-2 mb-2 rounded bg-slate-800 border border-slate-600 text-sm focus:outline-none">
            <textarea id="adminMsgInput" placeholder="اكتب رسالتك..." class="w-full p-2 mb-2 rounded bg-slate-800 border border-slate-600 h-20 text-sm focus:outline-none"></textarea>
            <button onclick="sendMessage()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-bold shadow">إرسال</button>
        </div>

        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 shadow-lg">
            <h3 class="font-bold mb-3 flex justify-between">السجل: <button onclick="fetchLogs()" class="text-xs text-blue-400">تحديث</button></h3>
            <div id="admin-logs" class="space-y-2 max-h-60 overflow-y-auto text-sm"></div>
        </div>
    </div>

    <!-- تحميل المكتبات في نهاية الصفحة لضمان عدم تجميد الأزرار -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        // --- 1. كود تدمير الكاش القديم (مهم جداً) ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }

        // --- 2. إعدادات قاعدة البيانات ---
        const SUPABASE_URL = 'https://vtdsuxpbuulumydvxqft.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0ZHN1eHBidXVsdW15ZHZ4cGZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMzA2MTQsImV4cCI6MjEwNDcwNjYxNH0.tDMl1mRQK-ZAyO0u6fbgrXYomvBFUqZuFWIZ9sHb_RQ';
        let supabase;
        
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {
            console.error("Supabase Error:", e);
        }

        let currentUser = null;
        let html5QrCode = null;
        let messageInterval = null;

        // --- 3. دوال التنقل الأساسية (التي كانت تتجمد) ---
        function hideAll() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('user-login-screen').style.display = 'none';
            document.getElementById('user-dashboard').style.display = 'none';
            document.getElementById('admin-login-screen').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'none';
        }

        function showUserLogin() {
            hideAll();
            document.getElementById('user-login-screen').style.display = 'block';
        }

        function showAdminLogin() {
            hideAll();
            document.getElementById('admin-login-screen').style.display = 'block';
        }

        function goBack() {
            hideAll();
            document.getElementById('start-screen').style.display = 'block';
        }

        function logout() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(e => console.log(e));
            }
            if(messageInterval) clearInterval(messageInterval);
            currentUser = null;
            goBack();
        }

        // --- 4. دوال المشترك ---
        function loginUser() {
            const name = document.getElementById('userNameInput').value.trim();
            if(!name) { alert('أدخل اسمك أولاً!'); return; }
            currentUser = name;
            hideAll();
            document.getElementById('user-dashboard').style.display = 'block';
            document.getElementById('welcome-message').innerText = `أهلاً ${currentUser}`;
            startScanner();
            fetchUserMessages();
            messageInterval = setInterval(fetchUserMessages, 5000);
        }

        function startScanner() {
            if(!window.Html5Qrcode) return;
            document.getElementById('reader').innerHTML = ""; // مسح رسالة التهيئة
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess, 
                (err) => {} // تجاهل أخطاء عدم وجود QR أمام الكاميرا
            ).catch(err => alert("تعذر تشغيل الكاميرا، تأكد من الصلاحيات."));
        }

        async function onScanSuccess(decodedText) {
            if (html5QrCode && html5QrCode.isScanning) {
                try { await html5QrCode.pause(true); } catch(e){}
            }
            
            const isValid = decodedText.includes("http");
            
            if(supabase) {
                await supabase.from('scan_logs').insert([
                    { user_name: currentUser, scan_content: decodedText, is_valid: isValid }
                ]);
            }

            alert(isValid ? `✅ قراءة صحيحة!\n${decodedText}` : `❌ رمز غير مدعوم!`);
            
            setTimeout(() => {
                if(html5QrCode) html5QrCode.resume();
            }, 3000);
        }

        async function scanFileFromGallery(event) {
            if (!event.target.files || event.target.files.length === 0) return;
            const file = event.target.files[0];

            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

            try {
                const decodedText = await html5QrCode.scanFile(file, true);
                onScanSuccess(decodedText);
            } catch (err) {
                alert("❌ لم يتم العثور على رمز QR في الصورة.");
            }
            event.target.value = '';
        }

        async function fetchUserMessages() {
            if(!supabase || !currentUser) return;
            const { data, error } = await supabase.from('messages').select('*')
                .or(`target_user.is.null,target_user.eq.${currentUser}`)
                .order('created_at', { ascending: false }).limit(10);
            
            const container = document.getElementById('user-messages');
            if(data && data.length > 0) {
                container.innerHTML = data.map(msg => `
                    <div class="bg-slate-800 p-2 rounded border-l-4 ${msg.target_user ? 'border-orange-500' : 'border-blue-500'} text-sm mb-2">
                        <span class="text-xs ${msg.target_user ? 'text-orange-400' : 'text-blue-400'} block mb-1">
                            ${msg.target_user ? '🔒 خاص' : '📢 عام'}
                        </span>
                        ${msg.content}
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p class="text-slate-400 text-sm">لا يوجد رسائل.</p>';
            }
        }

        // --- 5. دوال الإدارة ---
        async function loginAdmin() {
            const pass = document.getElementById('adminPassword').value.trim();
            if(!pass) { alert('أدخل كلمة المرور!'); return; }
            if(!supabase) { alert('خطأ في الاتصال بالسيرفر.'); return; }

            const { data, error } = await supabase.from('admin_settings').select('password').eq('id', 1).single();
            
            if(data && data.password === pass) {
                document.getElementById('adminPassword').value = '';
                hideAll();
                document.getElementById('admin-dashboard').style.display = 'block';
                fetchLogs();
            } else {
                alert('كلمة المرور خاطئة!');
            }
        }

        async function fetchLogs() {
            if(!supabase) return;
            const { data } = await supabase.from('scan_logs').select('*').order('created_at', { ascending: false }).limit(20);
            if(data) {
                document.getElementById('admin-logs').innerHTML = data.map(log => `
                    <div class="p-2 border-b border-slate-700 ${log.is_valid ? 'bg-green-900/20' : 'bg-red-900/20'}">
                        <span class="font-bold text-blue-300">${log.user_name}</span>
                        <p class="mt-1 truncate">${log.scan_content}</p>
                    </div>
                `).join('');
            }
        }

        async function sendMessage() {
            const content = document.getElementById('adminMsgInput').value.trim();
            const target = document.getElementById('targetUserInput').value.trim();
            if(!content) return;

            const { error } = await supabase.from('messages').insert([
                { sender: 'الإدارة', content: content, target_user: target || null }
            ]);
            
            if(!error) {
                alert('تم الإرسال!');
                document.getElementById('adminMsgInput').value = '';
                document.getElementById('targetUserInput').value = '';
            }
        }
    </script>
</body>
</html>

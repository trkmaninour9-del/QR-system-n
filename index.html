<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول الآمنة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b1120; color: #ffffff; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .glass-panel { background-color: #131c31; border: 1px solid #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- الواجهة الرئيسية (بوابة الدخول الآمنة) -->
    <div id="main-login-card" class="glass-panel w-full max-w-sm mt-12 p-6 rounded-2xl relative">
        <!-- أيقونة وعنوان -->
        <div class="text-center text-4xl mb-2">📱</div>
        <h2 class="text-center text-xl font-bold text-yellow-500 mb-1">بوابة الدخول الآمنة</h2>
        <p class="text-center text-xs text-gray-400 mb-8">اختر طريقة قراءة كود الـ QR:</p>

        <!-- أزرار المشتركين -->
        <button onclick="startUserAction('camera')" class="w-full bg-orange-500 hover:bg-orange-600 text-gray-900 font-bold py-3.5 px-4 rounded-xl mb-3 transition shadow-lg text-sm">
            الكاميرا الحية لمسح الـ QR 📸
        </button>
        
        <input type="file" id="file-upload" class="hidden" accept="image/*" onchange="handleFileUpload(event)">
        <button onclick="startUserAction('gallery')" class="w-full bg-[#0b1120] hover:bg-gray-900 border border-slate-700 text-yellow-500 font-bold py-3.5 px-4 rounded-xl mb-8 transition shadow-lg text-sm">
            صورة الـ QR من الاستديو 🖼️
        </button>

        <!-- فاصل الإدارة -->
        <div class="flex items-center my-4">
            <div class="flex-grow border-t border-slate-700"></div>
            <span class="px-3 text-slate-500 text-xs">أو دخول الأدمن</span>
            <div class="flex-grow border-t border-slate-700"></div>
        </div>

        <!-- أزرار الإدارة -->
        <input type="password" id="admin-pass" placeholder="كلمة مرور الأدمن (1234)" class="w-full bg-[#0b1120] border border-slate-700 text-center text-slate-300 py-3.5 px-4 rounded-xl mb-3 focus:outline-none focus:border-yellow-500 text-sm">
        <button onclick="adminLogin()" class="w-full bg-[#0b1120] hover:bg-gray-900 border border-slate-700 text-slate-300 font-bold py-3.5 px-4 rounded-xl transition shadow-lg text-sm">
            دخول لوحة التحكم
        </button>
    </div>

    <!-- شاشة مسح الكاميرا (تظهر عند الطلب) -->
    <div id="camera-container" class="glass-panel w-full max-w-sm mt-12 p-4 rounded-2xl hidden flex flex-col items-center">
        <h3 class="text-yellow-500 font-bold mb-3">مسح الباركود</h3>
        <div id="reader" class="w-full bg-black rounded-xl overflow-hidden border border-slate-700 min-h-[250px]"></div>
        <button onclick="cancelScan()" class="w-full mt-4 bg-red-900/50 hover:bg-red-800 border border-red-700 text-white font-bold py-2 rounded-xl transition text-sm">إلغاء</button>
    </div>

    <!-- لوحة تحكم الإدارة -->
    <div id="admin-dashboard" class="w-full max-w-md mt-6 space-y-4 pb-10 hidden">
        <div class="flex justify-between items-center glass-panel p-4 rounded-xl">
            <h2 class="text-lg font-bold text-yellow-500">لوحة التحكم الإدارية</h2>
            <button onclick="logoutAdmin()" class="text-red-400 text-xs hover:text-red-300 bg-red-900/20 px-3 py-1.5 rounded-lg">تسجيل خروج</button>
        </div>

        <!-- قسم تعديل المعطيات (الميزة الأهم) -->
        <div class="glass-panel p-4 rounded-xl">
            <h3 class="font-bold mb-2 text-green-400 text-sm">تعديل معطيات وملفات الـ QR:</h3>
            <p class="text-[11px] text-slate-400 mb-3">أدخل رمز النداء للبحث عن معطياته وتعديل كل ملف بشكل مستقل.</p>
            <div class="flex gap-2 mb-3">
                <input type="text" id="searchQrInput" placeholder="أدخل رمز QR هنا..." class="flex-grow p-2.5 rounded-lg bg-[#0b1120] border border-slate-700 text-sm focus:outline-none focus:border-green-500">
                <button onclick="searchQrData()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 rounded-lg font-bold text-sm">بحث</button>
            </div>
            <div id="edit-data-container" class="space-y-2 hidden mt-4 border-t border-slate-700 pt-3">
                <!-- المعطيات ستظهر هنا -->
            </div>
            <button id="save-edit-btn" onclick="saveEditedData()" class="w-full bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-lg font-bold shadow mt-3 hidden text-sm">حفظ التعديلات</button>
        </div>

        <!-- قسم المراسلة -->
        <div class="glass-panel p-4 rounded-xl">
            <h3 class="font-bold mb-3 text-sm text-blue-400">إرسال تنبيه للمشتركين:</h3>
            <input type="text" id="targetUserInput" placeholder="اسم المشترك (اتركه فارغاً للإرسال للجميع)" class="w-full p-2.5 mb-2 rounded-lg bg-[#0b1120] border border-slate-700 text-sm focus:outline-none">
            <textarea id="adminMsgInput" placeholder="اكتب رسالتك هنا..." class="w-full p-2.5 mb-2 rounded-lg bg-[#0b1120] border border-slate-700 h-20 text-sm focus:outline-none"></textarea>
            <button onclick="sendMessage()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-bold text-sm">إرسال الرسالة 🚀</button>
        </div>

        <!-- قسم السجل -->
        <div class="glass-panel p-4 rounded-xl">
            <h3 class="font-bold mb-3 flex justify-between text-sm">سجل دخول المشتركين: <button onclick="fetchLogs()" class="text-xs text-yellow-500">تحديث 🔄</button></h3>
            <div id="admin-logs" class="space-y-2 max-h-60 overflow-y-auto text-sm pr-1"></div>
        </div>
    </div>

    <script>
        // --- 1. إعدادات Supabase ---
        const SUPABASE_URL = 'https://vtdsuxpbuulumydvxqft.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0ZHN1eHBidXVsdW15ZHZ4cGZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMzA2MTQsImV4cCI6MjEwNDcwNjYxNH0.tDMl1mRQK-ZAyO0u6fbgrXYomvBFUqZuFWIZ9sHb_RQ';
        let supabase;
        try { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

        let currentUserName = "";
        let html5QrCode = null;
        let currentEditQrId = null;

        // --- 2. تفاعل المشتركين (بدون تشويه الواجهة) ---
        function startUserAction(actionType) {
            let name = prompt("الرجاء إدخال اسمك الكريم لتسجيل الدخول:");
            if (!name || name.trim() === "") return; // إلغاء إذا لم يدخل اسم
            
            currentUserName = name.trim();
            
            if (actionType === 'camera') {
                document.getElementById('main-login-card').classList.add('hidden');
                document.getElementById('camera-container').classList.remove('hidden');
                startScanner();
            } else if (actionType === 'gallery') {
                document.getElementById('file-upload').click();
            }
        }

        function startScanner() {
            if(!window.Html5Qrcode) { alert("جاري تحميل المكتبة، يرجى المحاولة بعد قليل."); return; }
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 220, height: 220 } },
                onScanSuccess, 
                (err) => {}
            ).catch(err => {
                alert("تعذر تشغيل الكاميرا. قد تحتاج لمنح الصلاحيات.");
                cancelScan();
            });
        }

        function cancelScan() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                }).catch(err => console.log(err));
            }
            document.getElementById('camera-container').classList.add('hidden');
            document.getElementById('main-login-card').classList.remove('hidden');
        }

        async function onScanSuccess(decodedText) {
            if (html5QrCode && html5QrCode.isScanning) {
                try { await html5QrCode.pause(true); } catch(e){}
            }
            processQR(decodedText);
            setTimeout(() => { if(html5QrCode) html5QrCode.resume(); }, 2000);
        }

        async function handleFileUpload(event) {
            if (!event.target.files || event.target.files.length === 0) return;
            const file = event.target.files[0];
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

            try {
                const decodedText = await html5QrCode.scanFile(file, true);
                processQR(decodedText);
            } catch (err) {
                alert("❌ لم يتم العثور على كود QR في الصورة.");
            }
            event.target.value = ''; // تصفير الملف
        }

        async function processQR(text) {
            const isValid = text.includes("http") || text.length > 3;
            
            // تسجيل الدخول في السيرفر
            if(supabase) {
                await supabase.from('scan_logs').insert([
                    { user_name: currentUserName, scan_content: text, is_valid: isValid }
                ]);
            }

            if(isValid) {
                alert(`أهلاً بك ${currentUserName} 🟢\nتمت القراءة بنجاح:\n${text}`);
                if(text.includes("http")) {
                    if(confirm("هل تريد فتح الرابط المرفق؟")) window.open(text, '_blank');
                }
            } else {
                alert(`عذراً ${currentUserName} 🔴\nالرمز غير صالح أو غير مدعوم.`);
            }
        }

        // --- 3. تفاعل الإدارة ---
        async function adminLogin() {
            const pass = document.getElementById('admin-pass').value;
            // السماح بالدخول إذا كانت كلمة السر 1234 أو حسب قاعدة البيانات
            if(pass === "1234") {
                document.getElementById('main-login-card').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                document.getElementById('admin-pass').value = '';
                fetchLogs();
            } else {
                alert("كلمة المرور خاطئة!");
            }
        }

        function logoutAdmin() {
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('main-login-card').classList.remove('hidden');
        }

        async function fetchLogs() {
            if(!supabase) return;
            const { data } = await supabase.from('scan_logs').select('*').order('created_at', { ascending: false }).limit(20);
            if(data) {
                document.getElementById('admin-logs').innerHTML = data.map(log => {
                    const time = new Date(log.created_at).toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
                    return `
                    <div class="p-2.5 mb-2 rounded-lg bg-[#0b1120] border-r-4 ${log.is_valid ? 'border-r-green-500' : 'border-r-red-500'}">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-yellow-500 text-xs">👤 ${log.user_name}</span>
                            <span class="text-[10px] text-slate-500">${time}</span>
                        </div>
                        <p class="text-[11px] text-slate-300 break-all">${log.scan_content}</p>
                    </div>
                `}).join('');
            }
        }

        async function sendMessage() {
            const content = document.getElementById('adminMsgInput').value.trim();
            const target = document.getElementById('targetUserInput').value.trim();
            if(!content) { alert('اكتب الرسالة أولاً!'); return; }
            if(supabase) {
                await supabase.from('messages').insert([{ sender: 'الإدارة', content: content, target_user: target || null }]);
                alert('✅ تم إرسال الرسالة بنجاح!');
                document.getElementById('adminMsgInput').value = '';
            }
        }

        async function searchQrData() {
            const query = document.getElementById('searchQrInput').value.trim();
            if(!query) return;

            const { data } = await supabase.from('qr_data').select('*').eq('qr_code', query).single();
            const container = document.getElementById('edit-data-container');
            const saveBtn = document.getElementById('save-edit-btn');
            
            let parsedData = data && data.details ? data.details : { "البيانات_1": "", "البيانات_2": "", "البيانات_3": "", "البيانات_4": "" };
            currentEditQrId = data ? data.id : "NEW_" + query;

            let inputsHtml = data ? `<p class="text-xs text-green-400 mb-2">تم العثور على معطيات، يمكنك تعديلها:</p>` : `<p class="text-xs text-orange-400 mb-2">رمز جديد، أدخل معطياته 4 ملفات:</p>`;
            
            for(let key in parsedData) {
                inputsHtml += `
                    <div class="mb-2">
                        <label class="block text-[10px] text-slate-400 mb-1">${key}:</label>
                        <input type="text" id="edit-field-${key}" value="${parsedData[key]}" class="w-full p-2 rounded bg-[#0b1120] border border-slate-600 text-xs focus:border-yellow-500 focus:outline-none">
                    </div>
                `;
            }
            
            container.innerHTML = inputsHtml;
            container.classList.remove('hidden');
            saveBtn.classList.remove('hidden');
        }

        async function saveEditedData() {
            const container = document.getElementById('edit-data-container');
            const inputs = container.querySelectorAll('input');
            let updatedData = {};
            
            inputs.forEach(input => { updatedData[input.id.replace('edit-field-', '')] = input.value; });

            if(String(currentEditQrId).startsWith("NEW_")) {
                const qrCode = currentEditQrId.replace("NEW_", "");
                await supabase.from('qr_data').insert([{ qr_code: qrCode, details: updatedData }]);
            } else {
                await supabase.from('qr_data').update({ details: updatedData }).eq('id', currentEditQrId);
            }
            alert('✅ تم حفظ المعطيات بنجاح!');
            container.classList.add('hidden');
            document.getElementById('save-edit-btn').classList.add('hidden');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاستعلام والنداء الاحترافي</title>
    <link rel="manifest" href="manifest.json">
    <!-- مكتبات النظام الأساسية -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- شاشة البداية (اختيار الدخول) -->
    <div id="start-screen" class="w-full max-w-md mt-10 text-center">
        <h1 class="text-3xl font-bold text-orange-500 mb-8">نظام النداء الآلي</h1>
        <div class="space-y-4">
            <button onclick="showUserLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-lg">دخول المشتركين</button>
            <button onclick="showAdminLogin()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-lg transition border border-slate-600 shadow-lg">دخول الإدارة</button>
        </div>
    </div>

    <!-- شاشة دخول المشترك -->
    <div id="user-login-screen" class="w-full max-w-md mt-10 hidden">
        <h2 class="text-2xl font-bold text-center mb-6">تسجيل دخول المشترك</h2>
        <input type="text" id="userNameInput" placeholder="أدخل اسمك الكريم هنا..." class="w-full p-3 rounded-lg bg-slate-800 text-white border border-slate-600 mb-4 focus:border-blue-500 focus:outline-none">
        <button onclick="loginUser()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition mb-2 shadow-lg">متابعة</button>
        <button onclick="goBack()" class="w-full text-slate-400 py-2">رجوع</button>
    </div>

    <!-- لوحة المشترك (الماسح + الاستديو + الرسائل) -->
    <div id="user-dashboard" class="w-full max-w-md hidden">
        <div class="flex justify-between items-center mb-6 bg-slate-900 p-4 rounded-lg border border-slate-700 shadow-lg">
            <h2 id="welcome-message" class="text-lg font-bold text-blue-400">أهلاً بك</h2>
            <button onclick="logout()" class="text-red-400 text-sm hover:text-red-300">تسجيل خروج</button>
        </div>
        
        <!-- كاميرا الماسح -->
        <div id="reader" class="w-full bg-black rounded-lg overflow-hidden border-2 border-slate-700 mb-3 min-h-[250px]"></div>
        
        <!-- زر اختيار صورة من المعرض/الاستديو -->
        <div class="mb-6 text-center">
            <input type="file" id="qr-input-file" accept="image/*" class="hidden" onchange="scanFileFromGallery(event)">
            <button onclick="document.getElementById('qr-input-file').click()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2.5 px-4 rounded-lg border border-slate-600 transition flex items-center justify-center gap-2 shadow">
                <span>🖼️ مسح رمز QR من الاستديو / الصور</span>
            </button>
        </div>

        <!-- صندوق الرسائل -->
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 shadow-lg">
            <h3 class="font-bold mb-3 text-orange-400 border-b border-slate-700 pb-2">صندوق الرسائل (عام وخاص):</h3>
            <div id="user-messages" class="space-y-2 max-h-48 overflow-y-auto">
                <p class="text-slate-400 text-sm">جاري جلب الرسائل...</p>
            </div>
        </div>
    </div>

    <!-- شاشة دخول الإدارة -->
    <div id="admin-login-screen" class="w-full max-w-md mt-10 hidden">
        <h2 class="text-2xl font-bold text-center mb-6">تسجيل دخول الإدارة</h2>
        <input type="password" id="adminPassword" placeholder="كلمة المرور..." class="w-full p-3 rounded-lg bg-slate-800 text-white border border-slate-600 mb-4 text-center">
        <button onclick="loginAdmin()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-lg transition mb-2 shadow-lg">دخول</button>
        <button onclick="goBack()" class="w-full text-slate-400 py-2">رجوع</button>
    </div>

    <!-- لوحة الإدارة -->
    <div id="admin-dashboard" class="w-full max-w-md hidden space-y-6 pb-10">
        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-lg border border-slate-700 mt-4 shadow-lg">
            <h2 class="text-xl font-bold text-orange-500">لوحة التحكم</h2>
            <button onclick="logout()" class="text-red-400 text-sm hover:text-red-300">تسجيل خروج</button>
        </div>

        <!-- إرسال رسالة -->
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 shadow-lg">
            <h3 class="font-bold mb-3">إرسال رسالة:</h3>
            <input type="text" id="targetUserInput" placeholder="اسم المشترك (اتركه فارغاً لرسالة للجميع)" class="w-full p-2 mb-2 rounded bg-slate-800 border border-slate-600 text-sm">
            <textarea id="adminMsgInput" placeholder="اكتب رسالتك هنا..." class="w-full p-2 mb-2 rounded bg-slate-800 border border-slate-600 h-20 text-sm"></textarea>
            <button onclick="sendMessage()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-bold shadow">إرسال</button>
        </div>

        <!-- سجل النشاطات -->
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 shadow-lg">
            <h3 class="font-bold mb-3 flex justify-between">سجل نشاطات المشتركين: <button onclick="fetchLogs()" class="text-xs text-blue-400">تحديث</button></h3>
            <div id="admin-logs" class="space-y-2 max-h-60 overflow-y-auto text-sm"></div>
        </div>

        <!-- تغيير كلمة المرور -->
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 shadow-lg">
            <h3 class="font-bold mb-3 text-red-400">تغيير كلمة مرور الإدارة:</h3>
            <input type="text" id="newAdminPassword" placeholder="كلمة المرور الجديدة..." class="w-full p-2 mb-2 rounded bg-slate-800 border border-slate-600 text-sm">
            <button onclick="changePassword()" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded font-bold shadow">حفظ التعديل</button>
        </div>
    </div>

    <script>
        // === إعدادات الاتصال بـ Supabase ===
        const SUPABASE_URL = 'https://vtdsuxpbuulumydvxqft.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0ZHN1eHBidXVsdW15ZHZ4cGZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMzA2MTQsImV4cCI6MjEwNDcwNjYxNH0.tDMl1mRQK-ZAyO0u6fbgrXYomvBFUqZuFWIZ9sHb_RQ';

        let supabase = null;
        let currentUser = null;
        let html5QrCode = null;

        // تهيئة قاعدة البيانات فور تحميل الصفحة
        window.addEventListener('load', () => {
            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log("Supabase connected successfully!");
            } else {
                alert("تعذر الاتصال بالمكتبة! تأكد من شبكة الإنترنت لديك.");
            }
        });

        // التنقل بين الشاشات
        function hideAll() {
            ['start-screen', 'user-login-screen', 'user-dashboard', 'admin-login-screen', 'admin-dashboard'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
        }

        function showUserLogin() { hideAll(); document.getElementById('user-login-screen').classList.remove('hidden'); }
        function showAdminLogin() { hideAll(); document.getElementById('admin-login-screen').classList.remove('hidden'); }
        function goBack() { hideAll(); document.getElementById('start-screen').classList.remove('hidden'); }

        async function logout() {
            if (html5QrCode && html5QrCode.isScanning) {
                try { await html5QrCode.stop(); } catch(e){}
            }
            currentUser = null;
            goBack();
        }

        // --- قسم المشترك ---
        function loginUser() {
            const name = document.getElementById('userNameInput').value.trim();
            if(!name) { alert('يرجى إدخال اسمك!'); return; }
            currentUser = name;
            hideAll();
            document.getElementById('user-dashboard').classList.remove('hidden');
            document.getElementById('welcome-message').innerText = `أهلاً بك يا ${currentUser} 🌟`;
            startScanner();
            fetchUserMessages();
        }

        function startScanner() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
            .catch(err => console.log("الكاميرا غير متاحة:", err));
        }

        async function onScanSuccess(decodedText) {
            if (html5QrCode && html5QrCode.isScanning) {
                try { await html5QrCode.pause(true); } catch(e){}
            }

            const isValid = decodedText.includes("http");

            if (supabase) {
                const { error } = await supabase.from('scan_logs').insert([
                    { user_name: currentUser, scan_content: decodedText, is_valid: isValid }
                ]);
                if(error) console.error("فشل حفظ السجل:", error);
            }

            if(isValid) {
                alert(`✅ قراءة صحيحة!\nالمحتوى: ${decodedText}`);
            } else {
                alert(`❌ رمز QR غير مدعوم!`);
            }

            setTimeout(() => {
                if (html5QrCode) {
                    try { html5QrCode.resume(); } catch(e){}
                }
            }, 3000);
        }

        function onScanFailure(error) { /* تجاهل الأخطاء العابرة للماسح */ }

        // مسح صورة من الاستديو
        async function scanFileFromGallery(event) {
            if (!event.target.files || event.target.files.length === 0) return;
            const file = event.target.files[0];

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            try {
                const decodedText = await html5QrCode.scanFile(file, true);
                onScanSuccess(decodedText);
            } catch (err) {
                alert("❌ لم يتم العثور على رمز QR صالح في الصورة المختارة!");
            }
            event.target.value = '';
        }

        async function fetchUserMessages() {
            if(!currentUser || !supabase) return;
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .or(`target_user.is.null,target_user.eq.${currentUser}`)
                .order('created_at', { ascending: false })
                .limit(10);

            const container = document.getElementById('user-messages');
            if (error) { container.innerHTML = '<p class="text-red-400">خطأ في جلب الرسائل</p>'; return; }
            if (!data || data.length === 0) { container.innerHTML = '<p class="text-slate-400">لا يوجد رسائل حالياً.</p>'; return; }

            container.innerHTML = data.map(msg => `
                <div class="bg-slate-800 p-3 rounded-lg border-l-4 ${msg.target_user ? 'border-orange-500' : 'border-blue-500'}">
                    <span class="text-xs ${msg.target_user ? 'text-orange-400' : 'text-blue-400'} font-bold">
                        ${msg.target_user ? '🔒 رسالة خاصة لك' : '📢 إعلان عام'}
                    </span>
                    <p class="mt-1">${msg.content}</p>
                </div>
            `).join('');
        }

        // --- قسم الإدارة ---
        async function loginAdmin() {
            const passInput = document.getElementById('adminPassword').value.trim();
            if (!passInput) { alert('أدخل كلمة المرور أولاً!'); return; }
            if (!supabase) { alert('جاري الاتصال بقاعدة البيانات، انتظر ثانية واحدة وجرب مجدداً.'); return; }

            try {
                const { data, error } = await supabase.from('admin_settings').select('password').eq('id', 1).single();

                if (error) {
                    alert('خطأ في قاعدة البيانات: ' + error.message);
                    return;
                }

                if (data && data.password === passInput) {
                    document.getElementById('adminPassword').value = '';
                    hideAll();
                    document.getElementById('admin-dashboard').classList.remove('hidden');
                    fetchLogs();
                } else {
                    alert('كلمة المرور خاطئة!');
                }
            } catch (err) {
                alert('حدث خطأ أثناء تسجيل الدخول: ' + err.message);
            }
        }

        async function fetchLogs() {
            if (!supabase) return;
            const { data, error } = await supabase.from('scan_logs').select('*').order('created_at', { ascending: false }).limit(20);
            const container = document.getElementById('admin-logs');
            if(data) {
                container.innerHTML = data.map(log => {
                    const time = new Date(log.created_at).toLocaleTimeString('ar-SY');
                    return `
                    <div class="p-2 border-b border-slate-700 ${log.is_valid ? 'bg-green-900/20' : 'bg-red-900/20'}">
                        <span class="font-bold text-blue-300">${log.user_name}</span> 
                        <span class="text-xs text-slate-400">(${time})</span>
                        <p class="mt-1 truncate">${log.scan_content}</p>
                        <span class="text-xs ${log.is_valid ? 'text-green-400' : 'text-red-400'}">${log.is_valid ? '✅ صحيحة' : '❌ خاطئة'}</span>
                    </div>`;
                }).join('');
            }
        }

        async function sendMessage() {
            const content = document.getElementById('adminMsgInput').value.trim();
            const target = document.getElementById('targetUserInput').value.trim();
            if(!content) { alert('اكتب الرسالة أولاً!'); return; }
            if(!supabase) { alert('قاعدة البيانات غير متصلة!'); return; }

            const { error } = await supabase.from('messages').insert([
                { sender: 'الإدارة', content: content, target_user: target || null }
            ]);

            if(!error) {
                alert('تم إرسال الرسالة بنجاح!');
                document.getElementById('adminMsgInput').value = '';
                document.getElementById('targetUserInput').value = '';
            } else { alert('حدث خطأ أثناء الإرسال: ' + error.message); }
        }

        async function changePassword() {
            const newPass = document.getElementById('newAdminPassword').value.trim();
            if(!newPass) { alert('أدخل كلمة المرور الجديدة!'); return; }
            if(!supabase) { alert('قاعدة البيانات غير متصلة!'); return; }

            const { error } = await supabase.from('admin_settings').update({ password: newPass }).eq('id', 1);
            if(!error) {
                alert('تم تغيير كلمة المرور بنجاح!');
                document.getElementById('newAdminPassword').value = '';
            } else {
                alert('فشل التغيير: ' + error.message);
            }
        }

        // تحديث رسائل المشترك كل 5 ثواني
        setInterval(() => {
            if(currentUser && !document.getElementById('user-dashboard').classList.contains('hidden')) {
                fetchUserMessages();
            }
        }, 5000);
    </script>
</body>
</html>
